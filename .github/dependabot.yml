version: 2

updates:
  # --- API (racine) ---
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Nest 12 est bloqué par @nestjs/throttler, dont aucune version publiée
      # n'accepte @nestjs/common@^12. Un bump majeur d'un seul de ces paquets
      # casse la résolution npm : c'est exactement ce qui a mis `npm ci` par
      # terre. À rouvrir quand le throttler suivra.
      - dependency-name: '@nestjs/*'
        update-types: [version-update:semver-major]
      # typeorm 0.3 -> 1.x change le contrat public : à migrer délibérément,
      # pas au fil d'une PR automatique.
      - dependency-name: 'typeorm'
        update-types: [version-update:semver-major]
    # Regroupé pour éviter une PR par paquet : les correctifs de sécurité
    # transitifs arrivent souvent par lots de dix ou plus.
    groups:
      security-patches:
        applies-to: security-updates
        patterns: ['*']
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  # --- Frontend ---
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      security-patches:
        applies-to: security-updates
        patterns: ['*']
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  # --- Actions GitHub utilisées par la CI ---
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
