name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Une nouvelle poussée annule le run précédent de la même branche.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, test, build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Aligné sur le champ `engines` : @nestjs/cli exige >= 20.11.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Audit (bloque sur high et critical)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: API (e2e against MySQL)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: e2e
          MYSQL_DATABASE: cv_tech
        ports:
          - 3306:3306
        # Sans ce healthcheck le job démarre avant que MySQL n'accepte les
        # connexions, et la suite échoue sur ECONNREFUSED plutôt que sur un test.
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pe2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      NODE_ENV: test
      PORT: '3000'
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USERNAME: root
      DB_PASSWORD: e2e
      DB_NAME: cv_tech
      # Pas de migrations dans le projet : le schéma est créé au démarrage.
      DB_SYNCHRONIZE: 'true'
      SECRET: ci-only-secret-not-used-anywhere-else
      FRONTEND_URL: http://localhost:4200

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: End-to-end tests
        run: npm run test:e2e

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Audit (bloque sur high et critical)
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
